<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17212b" />
    <meta name="description" content="SHAD — расписание, ученики и занятия в одном рабочем пространстве." />
    <title>SHAD — пространство для занятий</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('shad-theme') === 'light' ? 'light' : 'dark'
      } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
